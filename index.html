<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Своя игра — Сайт для подсчёта баллов</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top right, #113a3d 0%, #091d21 55%, #050f12 100%);
      color: #f0fdfa;
      min-height: 100vh;
    }
    .score-num {
      font-variant-numeric: tabular-nums;
    }
    .panel {
      background: rgba(13, 38, 43, 0.82);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(94, 234, 212, 0.14);
    }
    .leader-panel {
      border-color: rgba(249, 115, 22, 0.65);
      box-shadow: 0 0 28px -10px rgba(249, 115, 22, 0.4);
    }
    .loser-panel {
      border-color: rgba(161, 98, 7, 0.55);
      box-shadow: 0 0 24px -10px rgba(161, 98, 7, 0.35);
    }
    @keyframes popIn {
      0% { opacity: 0; transform: translateY(10px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .toast-anim {
      animation: popIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="antialiased selection:bg-orange-500/30 selection:text-orange-100">
  <div class="max-w-7xl mx-auto px-4 py-5 sm:py-7">
    <!-- Header -->
    <header class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between mb-5">
      <h1 id="siteTitle" class="text-2xl sm:text-3xl font-extrabold tracking-tight text-white select-none cursor-default">
        Своя игра <span class="text-teal-400 font-semibold">· Счёт</span>
      </h1>

      <div class="flex flex-wrap items-center gap-2">
        <button id="undoBtn" type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-semibold bg-teal-950/90 hover:bg-teal-900 text-teal-100 border border-teal-800/80 transition disabled:opacity-40 disabled:cursor-not-allowed">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
          Отменить ход
        </button>
        <button id="addPlayerBtn" type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-semibold bg-teal-600 hover:bg-teal-500 text-white shadow-sm transition disabled:opacity-40">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
          Игрок
        </button>
        <button id="resetBtn" type="button" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-sm font-semibold bg-orange-950/70 hover:bg-orange-900/80 text-orange-200 border border-orange-800/60 transition">
          Сброс
        </button>
      </div>
    </header>

    <!-- Prices & Presets Bar -->
    <section class="panel rounded-2xl p-3.5 sm:p-4 mb-5 space-y-3">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5">
          <span class="text-xs font-semibold uppercase tracking-wider text-teal-300/80 mr-1">Раунд:</span>
          <button type="button" data-preset="1" class="preset-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition">1 (100–500)</button>
          <button type="button" data-preset="2" class="preset-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition">2 (200–1000)</button>
          <button type="button" data-preset="3" class="preset-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition">3 (300–1500)</button>
        </div>

        <div id="roflControls" class="hidden flex items-center gap-2">
          <button id="soundToggleBtn" type="button" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-teal-950/80 hover:bg-teal-900 text-teal-200 border border-teal-800 transition">
            🔊 Звуки: Вкл
          </button>
          <button id="randomRoflBtn" type="button" class="px-3 py-1.5 rounded-lg text-xs font-bold bg-orange-500 hover:bg-orange-400 text-slate-950 transition shadow-sm">
            🎲 Бонус
          </button>
        </div>
      </div>

      <!-- Editable Custom Prices -->
      <div class="flex flex-wrap items-center gap-2 pt-2 border-t border-teal-800/40">
        <span class="text-xs font-semibold uppercase tracking-wider text-teal-300/80 mr-1">Цены:</span>
        <div id="priceInputs" class="flex flex-wrap items-center gap-1.5"></div>
      </div>
    </section>

    <!-- Side-by-Side Player Columns -->
    <main id="playersColumn" class="flex gap-3.5 overflow-x-auto pb-4 items-stretch"></main>
  </div>

  <!-- Toast Container -->
  <div id="toastBox" class="fixed bottom-5 right-5 z-40 flex flex-col gap-2 pointer-events-none max-w-xs"></div>

  <!-- Reset Confirmation Modal -->
  <div id="resetModal" class="fixed inset-0 z-50 hidden items-center justify-center bg-slate-950/75 backdrop-blur-sm p-4">
    <div class="panel rounded-2xl max-w-sm w-full p-5 shadow-2xl border border-teal-700/60">
      <h3 class="text-lg font-bold text-white mb-2">Сбросить счёт игры?</h3>
      <p class="text-sm text-teal-100/80 mb-5">Баллы и история плюсов и минусов у всех игроков очистятся. Имена игроков и цены вопросов останутся.</p>
      <div class="flex justify-end gap-2">
        <button id="cancelResetBtn" type="button" class="px-4 py-2 rounded-xl text-sm font-semibold bg-teal-950 hover:bg-teal-900 text-teal-100 border border-teal-800 transition">Отмена</button>
        <button id="confirmResetBtn" type="button" class="px-4 py-2 rounded-xl text-sm font-semibold bg-orange-600 hover:bg-orange-500 text-white transition">Сбросить</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'svoya_igra_scoreboard_v2';
    const PRESETS = {
      1: [100, 200, 300, 400, 500],
      2: [200, 400, 600, 800, 1000],
      3: [300, 600, 900, 1200, 1500]
    };

    const ROFL_PLUS_QUOTES = [
      'Сюдааа! 🔥',
      'Мозг работает на 100% 🧠',
      'Легчайшая для величайшего ⚡',
      'Красава, чисто на опыте! 😎',
      'Изи баллы 💸'
    ];

    const ROFL_MINUS_QUOTES = [
      'Ой, больно... 😬',
      'Ну бывает, не повезло 💀',
      'Минус вайб 📉',
      'Кнопка подвела, да? 🤡',
      'Рисковал — не фортануло 🎲'
    ];

    const defaultState = () => ({
      activePreset: 1,
      prices: [...PRESETS[1]],
      roflMode: false,
      soundOn: true,
      nextId: 4,
      players: [
        { id: 1, name: 'Игрок 1', score: 0, log: [] },
        { id: 2, name: 'Игрок 2', score: 0, log: [] },
        { id: 3, name: 'Игрок 3', score: 0, log: [] }
      ],
      undoStack: []
    });

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return defaultState();
        const p = JSON.parse(raw);
        if (!p || !Array.isArray(p.players) || p.players.length === 0) return defaultState();
        const prices = Array.isArray(p.prices) && p.prices.length === 5
          ? p.prices.map(n => Math.max(1, Math.round(Number(n) || 100)))
          : [...PRESETS[1]];
        return {
          activePreset: p.activePreset || null,
          prices,
          roflMode: Boolean(p.roflMode),
          soundOn: p.soundOn !== undefined ? Boolean(p.soundOn) : true,
          nextId: Number(p.nextId) || (Math.max(...p.players.map(x => Number(x.id) || 0), 0) + 1),
          players: p.players.map(pl => ({
            id: Number(pl.id),
            name: String(pl.name || 'Игрок'),
            score: Number(pl.score) || 0,
            log: Array.isArray(pl.log) ? pl.log.slice(0, 50) : []
          })),
          undoStack: Array.isArray(p.undoStack) ? p.undoStack.slice(0, 80) : []
        };
      } catch (e) {
        return defaultState();
      }
    }

    let state = loadState();
    let audioCtx = null;
    let titleClickCount = 0;
    let titleClickTimer = null;

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {
        // Fallback to in-memory state
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function playTone(type) {
      if (!state.roflMode || !state.soundOn) return;
      try {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        if (!audioCtx) audioCtx = new Ctx();
        if (audioCtx.state === 'suspended') audioCtx.resume();

        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'plus') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(523.25, now);
          osc.frequency.setValueAtTime(659.25, now + 0.08);
          osc.frequency.setValueAtTime(783.99, now + 0.16);
          gain.gain.setValueAtTime(0.12, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.start(now);
          osc.stop(now + 0.31);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(280, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.25);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.29);
        }
      } catch (e) {
        // Ignore audio errors
      }
    }

    function showToast(text, tone) {
      const box = document.getElementById('toastBox');
      const el = document.createElement('div');
      const colors = tone === 'plus'
        ? 'bg-teal-900/95 border-teal-400/50 text-teal-50'
        : (tone === 'minus'
          ? 'bg-orange-950/95 border-orange-400/50 text-orange-100'
          : 'bg-slate-900/95 border-amber-400/50 text-amber-100');
      el.className = `toast-anim px-3.5 py-2.5 rounded-xl border text-sm font-semibold shadow-xl ${colors}`;
      el.textContent = text;
      box.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transition = 'opacity 0.25s ease';
        setTimeout(() => el.remove(), 260);
      }, 2200);
    }

    function fireConfetti() {
      if (typeof confetti === 'function') {
        confetti({
          particleCount: 55,
          spread: 65,
          origin: { y: 0.7 },
          colors: ['#14b8a6', '#f97316', '#fbbf24', '#f0fdfa']
        });
      }
    }

    function getLeaderId() {
      if (state.players.length === 0) return null;
      const max = Math.max(...state.players.map(p => p.score));
      const allEqual = state.players.every(p => p.score === max);
      if (allEqual) return null;
      const leaders = state.players.filter(p => p.score === max);
      return leaders.length === 1 ? leaders[0].id : null;
    }

    function changeScore(playerId, delta, customNote) {
      const val = Math.round(Number(delta));
      if (!Number.isFinite(val) || val === 0) return;
      const player = state.players.find(p => p.id === playerId);
      if (!player) return;

      const prevLeader = getLeaderId();
      player.score += val;
      player.log.unshift({ delta: val, note: customNote || '' });
      if (player.log.length > 50) player.log.pop();

      state.undoStack.unshift({ playerId: player.id, delta: val });
      if (state.undoStack.length > 80) state.undoStack.pop();

      saveState();
      render();

      if (state.roflMode) {
        const newLeader = getLeaderId();
        playTone(val > 0 ? 'plus' : 'minus');
        if (customNote) {
          showToast(`${player.name}: ${customNote} (${val > 0 ? '+' : ''}${val})`, 'event');
        } else if (newLeader && newLeader !== prevLeader && newLeader === player.id) {
          showToast(`👑 ${player.name} вырывается на 1-е место!`, 'plus');
          fireConfetti();
        } else if (val >= Math.max(...state.prices)) {
          const q = ROFL_PLUS_QUOTES[Math.floor(Math.random() * ROFL_PLUS_QUOTES.length)];
          showToast(`${player.name} +${val} — ${q}`, 'plus');
          fireConfetti();
        } else if (val > 0) {
          const q = ROFL_PLUS_QUOTES[Math.floor(Math.random() * ROFL_PLUS_QUOTES.length)];
          showToast(`${player.name}: ${q}`, 'plus');
        } else {
          const q = ROFL_MINUS_QUOTES[Math.floor(Math.random() * ROFL_MINUS_QUOTES.length)];
          showToast(`${player.name}: ${q}`, 'minus');
        }
      }
    }

    function undoLast() {
      if (state.undoStack.length === 0) return;
      const last = state.undoStack.shift();
      const player = state.players.find(p => p.id === last.playerId);
      if (player) {
        player.score -= last.delta;
        if (player.log.length > 0) player.log.shift();
      }
      saveState();
      render();
    }

    function triggerRandomRofl() {
      if (state.players.length === 0) return;
      const target = state.players[Math.floor(Math.random() * state.players.length)];
      const events = [
        { delta: 50, text: 'Найдена заначка ведущего' },
        { delta: 100, text: 'Бонус за красивую улыбку' },
        { delta: -50, text: 'Налог на слишком умный вид' },
        { delta: -100, text: 'Кот в мешке поцарапал' },
        { delta: 150, text: 'Кешбэк за прошлый раунд' }
      ];
      const ev = events[Math.floor(Math.random() * events.length)];
      changeScore(target.id, ev.delta, ev.text);
    }

    function addPlayer() {
      if (state.players.length >= 10) return;
      const id = state.nextId++;
      state.players.push({ id, name: 'Игрок ' + (state.players.length + 1), score: 0, log: [] });
      saveState();
      render();
    }

    function removePlayer(playerId) {
      if (state.players.length <= 1) return;
      state.players = state.players.filter(p => p.id !== playerId);
      state.undoStack = state.undoStack.filter(item => item.playerId !== playerId);
      saveState();
      render();
    }

    function updatePlayerName(playerId, name) {
      const player = state.players.find(p => p.id === playerId);
      if (!player) return;
      player.name = name.trim() || ('Игрок ' + playerId);
      saveState();
    }

    function applyPreset(num) {
      if (!PRESETS[num]) return;
      state.activePreset = num;
      state.prices = [...PRESETS[num]];
      saveState();
      render();
    }

    function updatePrice(index, rawVal) {
      const val = Math.max(1, Math.round(Number(rawVal) || 0));
      if (!val) return;
      state.prices[index] = val;
      state.activePreset = null;
      saveState();
      render();
    }

    function getStreak(log) {
      if (!log || log.length === 0) return { type: null, count: 0 };
      const firstSign = log[0].delta > 0 ? 'plus' : 'minus';
      let count = 0;
      for (const item of log) {
        if ((item.delta > 0 && firstSign === 'plus') || (item.delta < 0 && firstSign === 'minus')) {
          count++;
        } else {
          break;
        }
      }
      return { type: firstSign, count };
    }

    function renderControls() {
      const roflControls = document.getElementById('roflControls');
      const soundBtn = document.getElementById('soundToggleBtn');

      if (state.roflMode) {
        roflControls.classList.remove('hidden');
      } else {
        roflControls.classList.add('hidden');
      }

      soundBtn.textContent = state.soundOn ? '🔊 Звуки: Вкл' : '🔇 Звуки: Выкл';

      document.querySelectorAll('.preset-btn').forEach(btn => {
        const num = Number(btn.dataset.preset);
        if (state.activePreset === num) {
          btn.className = 'preset-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-bold transition bg-orange-500 text-slate-950';
        } else {
          btn.className = 'preset-btn px-3 py-1.5 rounded-lg text-xs sm:text-sm font-semibold transition bg-teal-950/80 hover:bg-teal-900 text-teal-200 border border-teal-800/60';
        }
      });

      const priceWrap = document.getElementById('priceInputs');
      priceWrap.innerHTML = state.prices.map((price, i) => `
        <input
          type="number"
          min="1"
          step="10"
          value="${price}"
          data-price-idx="${i}"
          aria-label="Цена вопроса ${i + 1}"
          class="w-20 px-2.5 py-1.5 rounded-lg bg-teal-950/90 border border-teal-800 text-sm font-bold text-teal-50 text-center score-num focus:outline-none focus:border-orange-400"
        />
      `).join('');

      document.getElementById('undoBtn').disabled = state.undoStack.length === 0;
      document.getElementById('addPlayerBtn').disabled = state.players.length >= 10;
    }

    function renderPlayers() {
      const col = document.getElementById('playersColumn');
      const scores = state.players.map(p => p.score);
      const maxScore = Math.max(...scores);
      const minScore = Math.min(...scores);
      const hasSpread = maxScore !== minScore;

      col.innerHTML = state.players.map((player, idx) => {
        const isFirst = hasSpread && player.score === maxScore;
        const isLast = hasSpread && state.players.length > 1 && player.score === minScore;
        const streak = getStreak(player.log);

        let cardExtra = '';
        if (isFirst) cardExtra = 'leader-panel';
        else if (state.roflMode && isLast) cardExtra = 'loser-panel';

        const badges = [];
        if (state.roflMode) {
          if (isFirst) badges.push('<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-orange-500/20 text-orange-300 border border-orange-400/40">👑 Мегамозг</span>');
          else if (isLast) badges.push('<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-amber-900/50 text-amber-200 border border-amber-700/60">💩 Зато красивый</span>');
          if (player.score < 0) badges.push('<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-300 border border-rose-500/30">💸 В долгах</span>');
          if (streak.type === 'plus' && streak.count >= 3) badges.push(`<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-teal-500/20 text-teal-200 border border-teal-400/40">🔥 Стрик x${streak.count}</span>`);
          if (streak.type === 'minus' && streak.count >= 2) badges.push('<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-rose-950/80 text-rose-300 border border-rose-700/50">😵 Тильт</span>');
        } else if (isFirst) {
          badges.push('<span class="px-2 py-0.5 rounded-full text-xs font-bold bg-orange-500/20 text-orange-300 border border-orange-400/40">Лидер</span>');
        }

        const rankPrefix = state.roflMode
          ? (isFirst ? '👑' : (isLast ? '💩' : `#${idx + 1}`))
          : `#${idx + 1}`;

        const scoreColor = player.score > 0
          ? 'text-white'
          : (player.score < 0 ? 'text-orange-400' : 'text-teal-200/80');

        const priceRows = state.prices.map(val => `
          <div class="grid grid-cols-2 gap-1.5">
            <button type="button" data-action="score" data-id="${player.id}" data-delta="${val}" class="py-1.5 rounded-lg text-sm font-bold score-num bg-teal-500/20 hover:bg-teal-500/35 text-teal-200 border border-teal-400/30 transition active:scale-95">+${val}</button>
            <button type="button" data-action="score" data-id="${player.id}" data-delta="-${val}" class="py-1.5 rounded-lg text-sm font-bold score-num bg-orange-500/15 hover:bg-orange-500/30 text-orange-300 border border-orange-500/30 transition active:scale-95">−${val}</button>
          </div>
        `).join('');

        const plusCount = player.log.filter(x => x.delta > 0).length;
        const minusCount = player.log.filter(x => x.delta < 0).length;

        const logHtml = player.log.length === 0
          ? '<div class="text-xs text-teal-200/40 italic text-center py-3">Ходов пока нет</div>'
          : player.log.map((item, logIdx) => {
              const isPos = item.delta > 0;
              const cls = isPos
                ? 'bg-teal-500/15 text-teal-200 border-teal-500/25'
                : 'bg-orange-500/15 text-orange-300 border-orange-500/25';
              const label = isPos ? `+${item.delta}` : `${item.delta}`;
              const stepNum = player.log.length - logIdx;
              return `
                <div title="${escapeHtml(item.note)}" class="flex items-center justify-between px-2.5 py-1 rounded-lg text-xs font-bold score-num border ${cls}">
                  <span class="opacity-60 font-medium">#${stepNum}</span>
                  <span>${label}</span>
                </div>
              `;
            }).join('');

        return `
          <article class="panel rounded-2xl p-4 flex flex-col min-w-[235px] flex-1 transition ${cardExtra}">
            <!-- Column Header: Rank, Name, Remove -->
            <div class="flex items-center justify-between gap-2 mb-2">
              <div class="flex items-center gap-2 min-w-0 flex-1">
                <span class="w-7 h-7 rounded-lg bg-teal-950/90 border border-teal-800/80 flex items-center justify-center text-xs font-bold text-teal-300 shrink-0">${rankPrefix}</span>
                <input
                  type="text"
                  value="${escapeHtml(player.name)}"
                  data-action="rename"
                  data-id="${player.id}"
                  aria-label="Имя игрока"
                  class="bg-transparent border-b border-transparent focus:border-teal-400 focus:outline-none text-base font-bold text-white w-full min-w-0 truncate py-0.5"
                />
              </div>
              ${state.players.length > 1 ? `
                <button type="button" data-action="remove" data-id="${player.id}" title="Удалить игрока" class="p-1 rounded-lg text-teal-300/60 hover:text-orange-300 hover:bg-teal-950 transition shrink-0">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>` : ''}
            </div>

            <!-- Badges -->
            ${badges.length > 0 ? `<div class="flex flex-wrap items-center gap-1 mb-2">${badges.join('')}</div>` : '<div class="h-1"></div>'}

            <!-- Big Score -->
            <div class="text-center py-2 mb-3 rounded-xl bg-teal-950/60 border border-teal-800/40">
              <div class="text-4xl font-extrabold score-num tracking-tight ${scoreColor}">
                ${player.score}
              </div>
            </div>

            <!-- Vertical Price Buttons (+ / -) -->
            <div class="space-y-1.5 mb-2.5">
              ${priceRows}
            </div>

            <!-- Custom Bet -->
            <div class="flex items-center gap-1.5 mb-3.5">
              <input
                type="number"
                step="10"
                min="1"
                placeholder="Ставка"
                data-custom-input="${player.id}"
                class="w-full min-w-0 px-2.5 py-1.5 rounded-lg bg-teal-950/90 border border-teal-800 text-xs sm:text-sm text-white placeholder:text-teal-300/40 focus:outline-none focus:border-orange-400"
              />
              <button type="button" data-action="custom-plus" data-id="${player.id}" class="px-2.5 py-1.5 rounded-lg text-sm font-bold bg-teal-600 hover:bg-teal-500 text-white transition shrink-0">+</button>
              <button type="button" data-action="custom-minus" data-id="${player.id}" class="px-2.5 py-1.5 rounded-lg text-sm font-bold bg-orange-600 hover:bg-orange-500 text-white transition shrink-0">−</button>
            </div>

            <!-- Vertical Per-Player History Column -->
            <div class="pt-2.5 border-t border-teal-800/40 flex-1 flex flex-col">
              <div class="flex items-center justify-between text-xs font-semibold text-teal-300/70 mb-2">
                <span>История</span>
                <span class="flex items-center gap-2 score-num">
                  <span class="text-teal-300">+${plusCount}</span>
                  <span class="text-orange-300">−${minusCount}</span>
                </span>
              </div>
              <div class="flex flex-col gap-1 max-h-52 overflow-y-auto pr-0.5">
                ${logHtml}
              </div>
            </div>
          </article>
        `;
      }).join('');
    }

    function render() {
      renderControls();
      renderPlayers();
    }

    const playersColumn = document.getElementById('playersColumn');
    playersColumn.addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-action]');
      if (!btn) return;
      const action = btn.dataset.action;
      const id = Number(btn.dataset.id);

      if (action === 'score') {
        changeScore(id, Number(btn.dataset.delta));
      } else if (action === 'remove') {
        removePlayer(id);
      } else if (action === 'custom-plus' || action === 'custom-minus') {
        const input = playersColumn.querySelector(`input[data-custom-input="${id}"]`);
        if (!input) return;
        const val = Math.abs(Number(input.value));
        if (!val || !Number.isFinite(val)) return;
        changeScore(id, action === 'custom-plus' ? val : -val);
        input.value = '';
      }
    });

    playersColumn.addEventListener('change', (e) => {
      const input = e.target.closest('input[data-action="rename"]');
      if (!input) return;
      updatePlayerName(Number(input.dataset.id), input.value);
    });

    document.getElementById('priceInputs').addEventListener('change', (e) => {
      const input = e.target.closest('input[data-price-idx]');
      if (!input) return;
      updatePrice(Number(input.dataset.priceIdx), input.value);
    });

    document.querySelectorAll('.preset-btn').forEach(btn => {
      btn.addEventListener('click', () => applyPreset(Number(btn.dataset.preset)));
    });

    // Hidden triple-click toggle on title
    document.getElementById('siteTitle').addEventListener('click', () => {
      titleClickCount++;
      clearTimeout(titleClickTimer);
      titleClickTimer = setTimeout(() => { titleClickCount = 0; }, 600);
      if (titleClickCount >= 3) {
        titleClickCount = 0;
        state.roflMode = !state.roflMode;
        saveState();
        render();
        showToast(state.roflMode ? '🤡 Секретный режим включён!' : 'Строгий режим', 'event');
      }
    });

    document.getElementById('soundToggleBtn').addEventListener('click', () => {
      state.soundOn = !state.soundOn;
      saveState();
      renderControls();
    });

    document.getElementById('randomRoflBtn').addEventListener('click', triggerRandomRofl);
    document.getElementById('undoBtn').addEventListener('click', undoLast);
    document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);

    const resetModal = document.getElementById('resetModal');
    document.getElementById('resetBtn').addEventListener('click', () => {
      resetModal.classList.remove('hidden');
      resetModal.classList.add('flex');
    });
    document.getElementById('cancelResetBtn').addEventListener('click', () => {
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
    });
    document.getElementById('confirmResetBtn').addEventListener('click', () => {
      state.players.forEach(p => {
        p.score = 0;
        p.log = [];
      });
      state.undoStack = [];
      saveState();
      resetModal.classList.add('hidden');
      resetModal.classList.remove('flex');
      render();
    });

    render();
  </script>
</body>
</html>
