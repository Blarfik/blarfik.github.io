<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Команды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-content">
            <a href="index.html" class="brand"><img src="https://via.placeholder.com/32" alt="Logo"> ТвойНик</a>
            <ul class="nav-links">
                <li><a href="index.html">Главная</a></li>
                <li><a href="commands.html" class="active">Команды</a></li>
            </ul>
            <button id="theme-toggle" class="theme-toggle">☀️</button>
        </div>
    </nav>

    <main>
        <div class="commands-layout">
            <div class="commands-sidebar">
                <div class="command-category active">💬 Чат</div>
                <div class="command-category">ℹ️ Ссылки и информация</div>
                <div class="command-category">🌍 IRL</div>
            </div>

            <div class="commands-list">
                <div class="command-group-header">💬 Чат</div>
                <div class="cmd-item">
                    <div>
                        <div class="cmd-name">$math [выражение]</div>
                        <p>Калькулятор</p>
                    </div>
                </div>
                
                <div class="command-group-header">ℹ️ Ссылки и информация</div>
                <div class="cmd-item">
                    <div class="cmd-name">!donate</div>
                    <p>Ссылка на донат</p>
                </div>
                <div class="cmd-item">
                    <div class="cmd-name">!пасты</div>
                    <p>Телеграм канал с пастами из чата</p>
                </div>

                <div class="command-group-header">🌍 IRL</div>
                <div class="cmd-item">
                    <div>
                        <div class="cmd-name">$currency [сумма] [валюта]</div>
                        <p>Курс валют по официальным данным</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
